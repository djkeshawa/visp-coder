name: release

# Pushing a tag vX.Y.Z[-pre.N] on main stages that version on npm and drafts
# the GitHub release from its CHANGELOG.md section. A maintainer approves the
# staged version with 2FA, which publishes it, and then publishes the draft
# (the job summary lists both steps). A prerelease version goes to the
# dist-tag named by its identifier (0.5.0-beta.3 -> beta).
on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install the pinned package manager
        run: npm install --global pnpm@11.3.0
      - run: pnpm install --frozen-lockfile

      - name: Check the tag, version and branch
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main; merge the release to main before tagging"
            exit 1
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::error::${name}@${version} is already published"
            exit 1
          fi
          pre=$(node -p "(require('./package.json').version.split('-')[1] ?? '').split('.')[0]")
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${pre:-latest}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ -n "${pre}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.meta.outputs.version }}" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.meta.outputs.version }}"
            exit 1
          fi

      # Includes a tarball consumer install, so publishing exercises the same
      # packaged binary rather than trusting the repository's live dist.
      - run: pnpm release:check
        env:
          CHROME_BIN: /usr/bin/google-chrome

      # Staged publishing needs npm 11.15 or later; Node 22 bundles npm 10.
      # Installed after release:check so its package smoke test keeps the bundled npm.
      - name: Install npm with staged publishing
        run: npm install --global npm@11.19.1

      # release:check just ran; prepublishOnly would run it again. npm reports a
      # normalized bin path as "invalid and removed" too, so package.json keeps
      # them in normalized form and either message fails the release.
      - name: Check the tarball keeps its executables
        run: |
          npm stage publish --dry-run --ignore-scripts --access public --tag "${{ steps.meta.outputs.dist_tag }}" 2>&1 | tee "${RUNNER_TEMP}/dry-run.log"
          if grep -qE "invalid and removed|removed invalid|was removed" "${RUNNER_TEMP}/dry-run.log"; then
            echo "::error::npm would change or drop entries of the package"
            exit 1
          fi

      # NPM_TOKEN is a stage-only token: it can stage a version but not publish one.
      - name: Stage the version on npm
        run: npm stage publish --ignore-scripts --provenance --access public --tag "${{ steps.meta.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Draft the GitHub release
        run: |
          flags=()
          [ "${{ steps.meta.outputs.prerelease }}" = true ] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" --verify-tag --draft \
            --title "VISP ${{ steps.meta.outputs.version }}" \
            --notes-file "${RUNNER_TEMP}/notes.md" "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: List the steps that finish the release
        run: |
          spec="${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}"
          {
            echo "## ${spec} is staged, not published"
            echo
            echo "1. Review and approve it with 2FA: the Staged Packages tab of the package on npmjs.com, or"
            echo '   `npm stage list '"${{ steps.meta.outputs.name }}"'` then `npm stage approve <stage-id>`.'
            echo '2. Publish the draft release: `gh release edit '"${GITHUB_REF_NAME}"' --draft=false`.'
            echo
            echo '```'
            npm stage list "${{ steps.meta.outputs.name }}" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
