version: 2
feature: 001-make-a-browser-game-like
incomplete: false
originalRequest: Make a browser game like Angry Birds.. runs by opening a html
  file in a browser. Make it fun.
goal: Make a browser game like Angry Birds.. runs by opening a html file in a
  browser. Make it fun.
outcomes:
  - id: O001
    kind: functional
    statement: Opening index.html directly from a file:// URL loads a playable first
      level without a server, network requests, or external dependencies.
    priority: must
    provenance: user-stated
    reviewRequired: false
    expectations: []
  - id: O002
    kind: functional
    statement: The player can aim and launch a bird with pointer drag,
      click-to-launch, or keyboard controls; the bird follows a visible physics
      arc and collides with breakable blocks and targets.
    priority: must
    provenance: agent-proposed
    reviewRequired: false
    expectations: []
  - id: O003
    kind: functional
    statement: The game tracks score, remaining shots, target clears, win/loss
      states, restart, and progression across three increasingly tricky levels.
    priority: must
    provenance: agent-proposed
    reviewRequired: false
    expectations: []
  - id: O004
    kind: experience
    statement: The game feels playful and memorable through an original storybook
      sunset-island art direction, readable HUD, impact particles, screen shake,
      synthesized sound effects, and responsive layout.
    priority: must
    provenance: user-stated
    reviewRequired: false
    expectations: []
  - id: O005
    kind: quality
    statement: Visible controls are keyboard-focusable and labeled, reduced-motion
      preferences are respected, and the game does not throw runtime errors when
      reset or replayed.
    priority: must
    provenance: agent-proposed
    reviewRequired: false
    expectations: []
examples:
  - id: E001
    title: Local launch
    given:
      - A browser opens file:///absolute/project/index.html directly
    when: The page finishes loading
    expected:
      - The Flockshot title, score, shots, canvas, and launch instructions are
        visible
      - The first level is ready for input
    outcomes:
      - O001
      - O004
  - id: E002
    title: Aim and impact
    given:
      - A level is ready
      - A bird is loaded in the sling
    when: The player drags the bird away from the sling and releases
    expected:
      - The sling snaps
      - The bird travels in a visible arc
      - A collision updates the score or target count
    outcomes:
      - O002
      - O004
  - id: E003
    title: Clear a level
    given:
      - All targets in a level are still active
    when: The player clears every target
    expected:
      - A win message appears
      - The next-level action becomes available
      - Reset returns to a fresh shot
    outcomes:
      - O003
      - O004
  - id: E004
    title: Keyboard replay
    given:
      - A level is ready
    when: The player uses arrow keys, Space, and R
    expected:
      - Arrow keys adjust aim
      - Space launches
      - R resets the current level without an error
    outcomes:
      - O002
      - O005
decisions:
  - id: D001
    statement: Use a canvas for the playfield with an HTML HUD and buttons around
      it, and draw all characters, blocks, scenery, particles, and icons
      procedurally.
    rationale: This keeps the game visual and responsive while avoiding image assets.
    evidence:
      - The user requires a game that runs by opening an HTML file.
    implications:
      - The entire game can be opened locally with no asset paths or network
        dependency.
    outcomes:
      - O001
      - O004
  - id: D002
    statement: Use classic local scripts instead of ES modules.
    rationale: Direct file URLs have fewer browser security and CORS surprises with
      classic scripts.
    evidence:
      - The game must work from file:// without a local server.
    implications:
      - Expose a small pure engine API for Node tests and keep DOM wiring in a
        separate browser path.
    outcomes:
      - O001
      - O005
  - id: D003
    statement: Give the game an original Flockshot / Cloudbreakers identity rather
      than copying Angry Birds characters or branding.
    rationale: A paper-cutout sunset sky island makes the genre legible while giving
      the game its own voice.
    evidence:
      - The request asks for a game like Angry Birds, not a branded reproduction.
    implications:
      - Use original names, shapes, palette, and copy throughout the UI.
    outcomes:
      - O004
uncertainties:
  - Whether the installed browser available to Visp can capture a file:// canvas
    journey with pointer input; resolve by running the recorded browser journey
    after implementation and preserve any capability gap as an environment
    limitation.
checks:
  - id: C001
    command:
      - node
      - --test
      - test/game.test.mjs
    outcomes:
      - O001
      - O002
      - O003
      - O005
    files:
      - index.html
      - game.js
      - test/game.test.mjs
    environment: node
  - id: C002
    command:
      kind: browser-journey
      journey:
        url: file:///absolute/project/index.html
        viewport:
          width: 1280
          height: 720
        actions:
          - kind: click
            selector: "#reset-game"
            capture: true
          - kind: click
            selector: "#game"
            position:
              x: 0.78
              y: 0.36
            capture: true
          - kind: wait-for
            attribute:
              name: data-state
              value: flying
            timeoutMs: 2000
            selector: "#game"
            capture: true
    outcomes:
      - O001
      - O002
      - O004
      - O005
    files:
      - index.html
      - game.js
    environment: browser
slices:
  - id: T001
    goal: Build the complete self-contained Flockshot browser game and its focused
      behavior checks.
    outcomes:
      - O001
      - O002
      - O003
      - O004
      - O005
    dependsOn: []
    scope:
      allowed:
        - index.html
        - game.js
        - test/game.test.mjs
        - visp.yml
      expected:
        - index.html
        - game.js
        - test/game.test.mjs
        - visp.yml
      forbidden: []
    checks:
      - C001
      - C002
    approach: Implement a small pure physics/state engine in game.js, wire it to a
      responsive canvas and accessible HTML controls, add procedural visuals and
      Web Audio feedback, then prove the core transitions with Node tests and a
      real file:// browser journey.
acceptanceBaseline: []
