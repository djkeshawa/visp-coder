version: 2
feature: 001-make-a-browser-game-like
incomplete: false
originalRequest: use visp-coder cli (global installed) and Make a browser game
  like Angry Birds.. runs by opening a html file in a browser. Make it fun.
goal: Make a browser game like Angry Birds that runs by opening an HTML file in
  a browser. Make it fun.
outcomes:
  - id: O001
    kind: functional
    statement: Opening index.html directly from disk loads a self-contained playable
      game without a build step or network dependency.
    priority: must
    provenance: user-stated
    reviewRequired: false
    expectations: []
  - id: O002
    kind: functional
    statement: A player can aim a bird with pointer or touch input, release it from
      the sling, and see it travel with gravity and bounce off the ground.
    priority: must
    provenance: user-stated
    reviewRequired: false
    expectations: []
  - id: O003
    kind: functional
    statement: Bird impacts can break wooden blocks, defeat green targets, award
      points, and advance to a victory or retry state.
    priority: must
    provenance: agent-proposed
    reviewRequired: false
    expectations: []
  - id: O004
    kind: experience
    statement: The game feels playful and readable through a distinctive sunset
      toybox visual style, clear HUD feedback, responsive controls, and
      satisfying local sound effects.
    priority: must
    provenance: user-stated
    reviewRequired: false
    expectations: []
  - id: O005
    kind: quality
    statement: The game remains usable on narrow screens, exposes keyboard focus,
      and respects reduced-motion preferences.
    priority: should
    provenance: agent-proposed
    reviewRequired: false
    expectations: []
examples:
  - id: E001
    title: The game is immediately understandable
    given:
      - A player opens index.html in a modern browser.
    when: The page finishes loading.
    expected:
      - The game title, score, bird count, canvas, and a clear start action are
        visible.
    outcomes:
      - O001
      - O004
  - id: E002
    title: Aiming launches the bird
    given:
      - A level is ready and a bird is waiting in the sling.
    when: The player drags from the bird, pulls back, and releases.
    expected:
      - The bird launches along the aimed arc, the bird count decreases, and the
        HUD updates.
    outcomes:
      - O002
  - id: E003
    title: Impacts create progress
    given:
      - A launched bird hits a target or structure.
    when: The impact resolves.
    expected:
      - The target or block reacts, the score increases when appropriate, and a
        visible result message appears when the level is won or lost.
    outcomes:
      - O003
      - O004
decisions:
  - id: D001
    statement: Use a 2D canvas and procedural shapes for the whole game.
    rationale: The user requires a game that works by opening an HTML file directly,
      so external assets and build tooling add unnecessary failure points.
    evidence:
      - Direct file launch is part of the original request.
    implications:
      - Keep index.html, styles.css, game-core.js, and game.js dependency-free
        and load them with ordinary script and link tags.
    outcomes:
      - O001
      - O004
  - id: D002
    statement: Make the game a short three-level arcade loop with a resettable state.
    rationale: A compact level arc gives the player replayable goals without
      expanding the first slice into a full content pipeline.
    evidence:
      - The request asks for a fun game, so replayable goals matter more than a
        single throw demo.
    implications:
      - Store level layouts as local data and expose level, score, birds, and
        result state in the HUD.
    outcomes:
      - O003
      - O004
  - id: D003
    statement: Use generated Web Audio tones instead of audio files.
    rationale: Local audio files are unnecessary for a playful feedback layer and
      would enlarge the direct-file surface.
    evidence:
      - The game is intentionally dependency-free and should work offline.
    implications:
      - Create short oscillator-based launch, hit, score, and win cues only
        after a user gesture.
    outcomes:
      - O004
uncertainties:
  - Will procedural shapes communicate enough character without image assets?
    Resolve with expressive silhouettes, oversized eyes, cheek marks, impact
    particles, and a restrained palette.
checks:
  - id: C001
    command:
      - node
      - --check
      - game-core.js
    outcomes:
      - O001
    files:
      - game-core.js
    environment: node
  - id: C002
    command:
      - node
      - --test
      - tests/game-core.test.mjs
    outcomes:
      - O002
      - O003
    files:
      - game-core.js
      - tests/game-core.test.mjs
    environment: node
  - id: C003
    command:
      kind: browser-journey
      journey:
        url: file:///absolute/project/index.html
        viewport:
          width: 1280
          height: 720
        actions:
          - kind: click
            selector: "#startButton"
            capture: true
          - kind: drag
            selector: "#gameCanvas"
            from:
              x: 310
              y: 563
            to:
              x: 400
              y: 505
            input: pointer
            captureDuring: true
            capture: false
          - kind: wait-for
            attribute:
              name: data-state
              value: flight
            timeoutMs: 3000
            selector: "#gameCanvas"
            capture: true
    outcomes:
      - O001
      - O002
      - O004
    files:
      - index.html
      - styles.css
      - game.js
    environment: browser
slices:
  - id: T001
    goal: Build and verify the complete offline canvas game and its core physics
      tests.
    outcomes:
      - O001
      - O002
      - O003
      - O004
      - O005
    dependsOn: []
    scope:
      allowed:
        - index.html
        - styles.css
        - game-core.js
        - game.js
        - tests/game-core.test.mjs
      expected:
        - index.html
        - styles.css
        - game-core.js
        - game.js
        - tests/game-core.test.mjs
      forbidden:
        - node_modules
        - dist
    checks:
      - C001
      - C002
      - C003
    approach: Keep physics pure and tested in game-core.js, keep browser rendering
      and input in game.js, and use procedural canvas/CSS visuals so the HTML
      file runs offline.
acceptanceBaseline: []
